services:
  # 1. Database MySQL 8.0
  mysql:
    image: mysql:8.0
    container_name: quizflex_mysql
    restart: always
    environment:
      MYSQL_DATABASE: quizflex_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - quizflex_network

  # 2. Qdrant Vector DB (Cho RAG AI)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: quizflex_qdrant
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - quizflex_network

  # 3. Backend Laravel HTTP API
  backend:
    build:
      context: ./be_quizflex
      dockerfile: Dockerfile
    container_name: quizflex_backend
    restart: always
    command: sh -c "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000 --workers=4"
    ports:
      - "8000:8000"
    volumes:
      - ./be_quizflex:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: quizflex_db
      DB_USERNAME: root
      DB_PASSWORD: root
      QDRANT_HOST: http://qdrant:6333
      REVERB_HOST: reverb
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8090
    depends_on:
      - mysql
      - qdrant
    networks:
      - quizflex_network

  # 4. Laravel Reverb WebSocket Server (Realtime)
  reverb:
    build:
      context: ./be_quizflex
      dockerfile: Dockerfile
    container_name: quizflex_reverb
    restart: always
    command: php artisan reverb:start --host=0.0.0.0 --port=8090
    ports:
      - "8090:8090"
    volumes:
      - ./be_quizflex:/var/www/html
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: quizflex_db
      DB_USERNAME: root
      DB_PASSWORD: root
    depends_on:
      - backend
    networks:
      - quizflex_network

  # 5. Laravel Queue Worker (Tiến trình sinh đề AI ngầm)
  queue_worker:
    build:
      context: ./be_quizflex
      dockerfile: Dockerfile
    container_name: quizflex_queue
    restart: always
    command: php artisan queue:work --tries=3 --timeout=120
    volumes:
      - ./be_quizflex:/var/www/html
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: quizflex_db
      DB_USERNAME: root
      DB_PASSWORD: root
    depends_on:
      - backend
    networks:
      - quizflex_network

  # 6. Frontend Vue 3 + Nginx Web Server
  frontend:
    build:
      context: ./fe_quizflex
      dockerfile: Dockerfile
    container_name: quizflex_frontend
    restart: always
    ports:
      - "8088:80"
    depends_on:
      - backend
      - reverb
    networks:
      - quizflex_network

volumes:
  mysql_data:
  qdrant_storage:

networks:
  quizflex_network:
    driver: bridge
